<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPulse — Smart Job Tracker & ATS Matcher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0b1120',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform duration-200">
                    <i class="fa-solid fa-bolt text-white text-lg"></i>
                </div>
                <div>
                    <span class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CareerPulse</span>
                    <span class="hidden sm:inline-block text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 ml-2 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">v1.0</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center space-x-1 sm:space-x-2">
                <a href="/" 
                   class="px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all flex items-center gap-2 {% if active_page == 'dashboard' %}bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 shadow-sm{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/discover" 
                   class="px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all flex items-center gap-2 {% if active_page == 'discover' %}bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 shadow-sm{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <i class="fa-solid fa-compass"></i>
                    <span>Discover Jobs</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 py-6 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            <p>© 2026 CareerPulse — Smart Job Application Tracker & ATS Matching Engine.</p>
        </div>
    </footer>

    <!-- Custom Scripts Block -->
    {% block scripts %}{% endblock %}
</body>
</html>
