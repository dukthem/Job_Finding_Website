<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareerPulse — Job Tracker & Live ATS Aggregator{% endblock %}</title>

  <!-- 1. Tailwind CSS via CDN for instant modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. FontAwesome for icons (briefcase, search, trash, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 3. Google Fonts (Inter font for clean tech UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-[#0B0F19] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Left: Brand Logo -->
        <a href="/" class="flex items-center space-x-3 group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-all">
            <i class="fa-solid fa-bolt-lightning text-lg"></i>
          </div>
          <div>
            <span class="text-lg font-bold text-white tracking-tight">Career<span class="text-indigo-400">Pulse</span></span>
            <span class="hidden sm:inline-block text-[10px] uppercase font-semibold px-2 py-0.5 ml-2 bg-indigo-500/10 text-indigo-400 rounded-full border border-indigo-500/20">Pro</span>
          </div>
        </a>

        <!-- Middle: Navigation Tabs -->
        <nav class="flex items-center space-x-1 sm:space-x-2">
          <a href="/" 
             class="px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center space-x-2 {% if request.url.path == '/' %}bg-indigo-600 text-white shadow-md shadow-indigo-600/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
            <i class="fa-solid fa-layer-group"></i>
            <span>My Applications</span>
          </a>
          
          <a href="/discover" 
             class="px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center space-x-2 {% if request.url.path == '/discover' %}bg-indigo-600 text-white shadow-md shadow-indigo-600/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Find Jobs & Match ATS</span>
          </a>
        </nav>

        <!-- Right: Status Badge -->
        <div class="hidden md:flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/40 px-3 py-1.5 rounded-full border border-slate-800">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Live SQLite Connected</span>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Placeholder (Where other pages inject their HTML) -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}
    <!-- Child templates will fill this space -->
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <p>CareerPulse &bull; Built with FastAPI, SQLite & Tailwind CSS &bull; 100% Free & Open Source</p>
  </footer>

  <!-- Page Specific JavaScript Placeholder -->
  {% block scripts %}
  {% endblock %}

</body>
</html>
